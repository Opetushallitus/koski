packages:
  - .

saveExact: true
engineStrict: true
strictPeerDependencies: true
updateNotifier: false
minimumReleaseAge: 4320
ignoreScripts: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
trustPolicyExclude:
  # Tulee jestin ja eslint-plugin-react-hooksin kautta: niiden käyttämä @babel/core
  # riippuu semver ^6.3.1:stä.
  # npm-tiimi julkaisi 6.3.1:n käsin heinäkuussa 2023 tietoturvakorjauksena, kun
  # 7.5.x-versiot julkaistiin jo CI:stä provenance-todistuksen kanssa. 6.x-haaraan
  # ei tule uusia versioita.
  - "semver@6.3.1"
