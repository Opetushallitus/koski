version: "3"
services:

  postgres:
    image: "postgres:15.17@sha256:32016c79bea24c14917660106bc23a03341d94b9983aeb41f4130b4f3fbd6dd0"
    command: "postgres -c max_connections=200 -c log_statement=all -c log_destination=stderr"
    environment:
      - "POSTGRES_USER=oph"
      - "POSTGRES_PASSWORD=oph"
      - "TZ=Europe/Helsinki"
    ports:
      - "5432:5432"
    volumes:
      - "./postgresql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "localhost", "--username", "oph"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s

  opensearch:
    build: "./opensearch"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
    ports:
      - "9200:9200"
    volumes:
      - "./opensearch/opensearch-docker.yml:/usr/share/opensearch/config/opensearch.yml"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 120s

  dynamodb:
    image: "amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab"
    ports:
      - "8000:8000"

  localstack:
    container_name: koski-localstack
    image: localstack/localstack:s3-latest-arm64@sha256:49b1837936c7fc0fc5267be80dab46f9b74d1bb973729a2becbd3c8585d9c5bd
    ports:
      - "127.0.0.1:4566:4566" # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack-volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
