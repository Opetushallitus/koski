name: Notify Slack of Renovate merges

on:
  push:
    branches: [master]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-26.04

    steps:
      - name: Find the merged pull request
        id: pull_request
        uses: $/.github/actions/merged-pull-request

      - name: Resolve the Renovate automerge
        id: resolve
        if: ${{ steps.pull_request.outputs.merged_by == 'renovate[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.pr_number }}
        run: |
          set -euo pipefail

          # The title is escaped because a bare > would close the Slack link early.
          slack_title=$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '":robot_face: Renovate automerged <\(.html_url)|#\(.number) \(.title | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))>"'
          )

          ci_run_url=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/master.yml")][0].html_url // empty'
          )

          echo "slack_title=$slack_title" >> "$GITHUB_OUTPUT"
          echo "ci_run_url=$ci_run_url" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: ${{ steps.resolve.outputs.slack_title != '' }}
        uses: $/.github/actions/report-slack
        with:
          webhook: ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
          title: ${{ steps.resolve.outputs.slack_title }}
          run_url: ${{ steps.resolve.outputs.ci_run_url }}
          include_context: repo commit ci_run
