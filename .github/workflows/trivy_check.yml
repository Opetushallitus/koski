name: Trivy dependency check

on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      upload-report:
        type: boolean
        default: false
      severity:
        type: string
        default: CRITICAL,HIGH
    outputs:
      cves:
        description: Vulnerabilities as a JSON array
        value: ${{ jobs.trivy_dependency_check.outputs.cves }}

permissions:
  contents: read

jobs:
  trivy_dependency_check:
    name: Trivy dependency check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      cves: ${{ steps.summarize.outputs.cves }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      TRIVY_SCANNERS: vuln
      TRIVY_SEVERITY: ${{ inputs.severity || 'CRITICAL,HIGH' }}
      TRIVY_SKIP_DIRS: src/main/resources/mockdata,src/test,target,omadata-oauth2-sample/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Populate the Maven cache before Trivy to avoid Maven Central rate limiting during dependency analysis.
      - uses: ./.github/actions/setup_java_25

      - name: Resolve Maven dependencies
        run: ./mvnw --batch-mode --file pom.xml dependency:go-offline

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          exit-code: 0
          trivyignores: .trivyignore
          format: json
          output: trivy-report.json

      - name: Check out the base commit
        if: env.BASE_SHA != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Trivy scan of the base commit
        if: env.BASE_SHA != ''
        working-directory: base
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: trivy fs --skip-db-update --format json --output ../base-report.json .

      - name: Summarize CVEs
        if: always() && hashFiles('trivy-report.json') != ''
        id: summarize
        run: |
          {
            echo 'cves<<EOF'
            jq -c '
              [.Results[]
               | select(.Vulnerabilities != null)
               | .Target as $target
               | .Vulnerabilities[]
               | {
                   target: $target,
                   severity: .Severity,
                   vulnerabilityId: .VulnerabilityID,
                   primaryUrl: .PrimaryURL,
                   packageName: .PkgName,
                   installedVersion: .InstalledVersion
                 }]
              | unique_by([.target, .severity, .vulnerabilityId, .primaryUrl, .packageName, .installedVersion])
            ' trivy-report.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Print Trivy report and fail on any vulnerability without a base commit
        if: always() && hashFiles('trivy-report.json') != ''
        env:
          # With a base commit, the next step fails only on vulnerabilities that the base commit does not have.
          EXIT_CODE: ${{ env.BASE_SHA == '' && 1 || 0 }}
        run: trivy convert --format table --scanners vuln --exit-code "$EXIT_CODE" trivy-report.json

      - name: Fail on any vulnerability not in the base commit, when there is one
        if: env.BASE_SHA != ''
        run: |
          new_vulnerabilities=$(jq --raw-output --slurpfile base base-report.json '
            def findings: [.Results[]? | .Target as $target | .Vulnerabilities[]? | "\($target): \(.PkgName) \(.VulnerabilityID)"];
            (findings - ($base[0] | findings)) | unique[]
          ' trivy-report.json)
          if [ -n "$new_vulnerabilities" ]; then
            echo "::error::Vulnerabilities not in the base commit:"
            echo "$new_vulnerabilities"
            exit 1
          fi

      - name: Upload Trivy report
        if: >-
          always() &&
          (inputs.upload-report || github.event_name == 'push') &&
          steps.summarize.outcome == 'success' &&
          steps.summarize.outputs.cves != '[]' &&
          hashFiles('trivy-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 2
