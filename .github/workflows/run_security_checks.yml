name: Run security tests
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan
    uses: ./.github/workflows/trivy_check.yml
    with:
      runs-on: ubuntu-24.04
      upload-report: true
      severity: CRITICAL,HIGH

  notify:
    name: Notify Slack
    runs-on: ubuntu-24.04
    needs: [scan]
    if: always() && needs.scan.result == 'failure'
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Get short commit SHA
        id: commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: printf 'short_sha=%.7s\n' "$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Format CVEs for Slack
        id: format-cves
        env:
          CVES: ${{ needs.scan.outputs.cves || '[]' }}
        run: |
          {
            echo 'cves<<EOF'
            jq -r '
              def severity_icon:
                if . == "CRITICAL" then "🔺 "
                elif . == "HIGH" then "🔸 "
                else ""
                end;
              def severity_label:
                if . == "CRITICAL" then "Critical"
                elif . == "HIGH" then "High"
                else .
                end;

              group_by(.target)[]
              | "*\(.[0].target)*",
                ([.[]
                  | "\(.severity | severity_icon)\(.severity | severity_label) · <\(.primaryUrl)|\(.vulnerabilityId)> · `\(.packageName)@\(.installedVersion)`"]
                 | join("\n")),
                ""
            ' <<< "$CVES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        env:
          CVES: ${{ steps.format-cves.outputs.cves }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PROD_ALERTS }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload: |
            {
              "text": ":rotating_light: Trivy dependency scan failed",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*:rotating_light: Trivy dependency scan failed*\n\n{{env.CVES}}"}},
                {"type": "context", "elements": [
                  {"type": "mrkdwn", "text": "*Repo:* ${{ github.repository }} | *Workflow:* ${{ github.workflow }}\n*Branch:* <${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}|${{ github.ref_name }}> | *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.commit.outputs.short_sha }}>\n*Triggered by:* ${{ github.triggering_actor }} via ${{ github.event_name }}${{ github.run_attempt > 1 && format(' | *Attempt:* {0}', github.run_attempt) || '' }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|View Run>*\n<https://trivy.util.yleiskayttoiset.opintopolku.fi/koski.html|See current status (use vpn)>"}
                ]},
                {"type": "divider"}
              ]
            }
