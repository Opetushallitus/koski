name: CI

on:
  pull_request:
  merge_group: { types: [checks_requested] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    # PR-ajoissa testit valitaan muutettujen polkujen perusteella.
    # OAuth2-integraatiotestit käyttävät myös Kosken kansalaiskäyttöliittymää.
    outputs:
      backend: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' }}
      koski-ui: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.koski-ui == 'true' }}
      schema-viewer: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.koski-ui == 'true' || steps.filter.outputs.schema-viewer == 'true' }}
      valpas-ui: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.valpas-ui == 'true' }}
      oauth2: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.koski-ui == 'true' || steps.filter.outputs.oauth2 == 'true' }}
      smoketests: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.smoketests == 'true' }}
      radiator: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.radiator == 'true' }}
      history-debug: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.history-debug == 'true' }}
      docker-image: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.docker-image == 'true' }}
      renovate: ${{ steps.filter.outputs.renovate == 'true' }}
      dependencies: ${{ steps.filter.outputs.dependencies == 'true' }}
      node-version: ${{ steps.filter.outputs.node-version == 'true' }}
      github-actions: ${{ steps.filter.outputs.github-actions == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # Oletuksena ajetaan kaikki testit. Vain erikseen rajatut polut saavat suppeamman testiajon.
            all:
              - '**'
              - '!src/**'
              - '!scala-schema/**'
              - '!web/**'
              - '!json-schema-viewer/**'
              - '!.browserslistrc'
              - '!valpas-web/**'
              - '!omadata-oauth2-sample/**'
              - '!smoketests/**'
              - '!radiator/**'
              - '!scripts/opiskeluoikeushistoria-debug/**'
              - '!docker-build/**'
              - '!.claude/**'
              - '!sandbox/**'
              - '!renovate.json'
              - '!.gitignore'
              - '!.git-blame-ignore-revs'
              - '!.trivyignore'
              - '!img.png'
              - &documentation-exclusions
                - '!documentation/**'
                - '!*.md'
                - '!**/README.md'
                - '!LICENSE.txt'

            backend:
              - *documentation-exclusions
              - 'src/**'
              - 'scala-schema/**'

            koski-ui:
              - *documentation-exclusions
              - 'web/**'
              - '!web/test/e2e/schema-viewer/**'
              - '.browserslistrc'

            schema-viewer:
              - *documentation-exclusions
              - 'json-schema-viewer/**'
              - 'web/test/e2e/schema-viewer/**'

            valpas-ui:
              - *documentation-exclusions
              - 'valpas-web/**'
              - '.browserslistrc'

            oauth2:
              - *documentation-exclusions
              - 'omadata-oauth2-sample/**'

            smoketests:
              - *documentation-exclusions
              - 'smoketests/**'

            radiator:
              - *documentation-exclusions
              - 'radiator/**'

            history-debug:
              - *documentation-exclusions
              - 'scripts/opiskeluoikeushistoria-debug/**'

            docker-image:
              - *documentation-exclusions
              - 'docker-build/**'

            renovate:
              - 'renovate.json'

            dependencies:
              - '**/pom.xml'
              - '**/pnpm-lock.yaml'
              - '.trivyignore'
              - '.github/workflows/trivy_check.yml'

            node-version:
              - '.nvmrc'
              - 'omadata-oauth2-sample/Dockerfile'
              - '.github/workflows/node_vulnerability_check.yml'

            github-actions:
              - '.github/**'

  no_merge_commits:
    name: No merge commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - name: Check PR commits for merge commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_COMMITS_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits
        run: |
          merge_commits=$(gh api --paginate "$PR_COMMITS_URL" --jq '.[] | select(.parents | length > 1) | .sha')
          if [ -n "$merge_commits" ]; then
            echo "::error::PR sisältää merge-committeja. Rebasea haara masterin päälle."
            exit 1
          fi

  tests:
    name: "Tests"
    needs: [changes]
    # Vain yhden Renovate-PR:n testiajo saa olla käynnissä kerrallaan.
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'renovate[bot]' && 'ci-tests-renovate' || format('ci-tests-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
      queue: max
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read
    with:
      run-backend-tests: ${{ needs.changes.outputs.backend == 'true' }}
      run-koski-ui-tests: ${{ needs.changes.outputs.koski-ui == 'true' }}
      run-schema-viewer-tests: ${{ needs.changes.outputs.schema-viewer == 'true' }}
      run-valpas-ui-tests: ${{ needs.changes.outputs.valpas-ui == 'true' }}
      run-oauth2-tests: ${{ needs.changes.outputs.oauth2 == 'true' }}
      run-smoketests-tests: ${{ needs.changes.outputs.smoketests == 'true' }}
      run-radiator-tests: ${{ needs.changes.outputs.radiator == 'true' }}
      run-history-debug-tests: ${{ needs.changes.outputs.history-debug == 'true' }}
      run-docker-image-tests: ${{ needs.changes.outputs.docker-image == 'true' }}

  appconfig_check:
    name: QA AppConfig keys
    # target/ tulee testien build_koski-jobista. Forkin PR ei saa salaisuuksia eikä OIDC-tunnistetta.
    needs: [changes, tests]
    # Ajetaan myös testien kaaduttua: tarkistus tarvitsee vain build_koskin tuloksen.
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup_java_25

      - name: Restore target dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "target/"
          key: ${{ runner.os }}-target-${{ github.sha }}
          fail-on-cache-miss: "true"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APPCONFIG_READ_ROLE_QA }}
          role-session-name: KoskiAppConfigCheck-${{ github.run_id }}
          aws-region: eu-west-1

      # Asennusvaihe tarkistaa vielä kohdeympäristön, myös QA:n, juuri ennen asennusta.
      - name: Check that QA AppConfig has every reference.conf key
        run: |
          set -euo pipefail
          CONFIG_FILE="$RUNNER_TEMP/appconfig.conf"
          trap 'rm -f "$CONFIG_FILE"' EXIT
          TOKEN=$(aws appconfigdata start-configuration-session \
            --application-identifier koski \
            --environment-identifier OPHKoskiQA \
            --configuration-profile-identifier OPHKoskiQA \
            --query InitialConfigurationToken --output text)
          aws appconfigdata get-latest-configuration --configuration-token "$TOKEN" "$CONFIG_FILE" > /dev/null
          ./mvnw --batch-mode --quiet exec:java -Dexec.mainClass=fi.oph.koski.config.AppConfigAvaintarkistus < "$CONFIG_FILE"

  trivy:
    name: Trivy
    needs: [changes]
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    uses: $/.github/workflows/trivy_check.yml
    permissions:
      contents: read

  node_vulnerabilities:
    name: Node.js vulnerabilities
    needs: [changes]
    if: ${{ needs.changes.outputs.node-version == 'true' }}
    uses: $/.github/workflows/node_vulnerability_check.yml
    permissions:
      contents: read

  zizmor:
    name: zizmor
    needs: [changes]
    if: ${{ needs.changes.outputs.github-actions == 'true' }}
    uses: $/.github/workflows/zizmor_check.yml
    permissions:
      contents: read

  renovate_config:
    name: Renovate config check
    needs: [changes]
    if: ${{ needs.changes.outputs.renovate == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Node version required by Renovate
        id: renovate_node
        run: echo "version=$(npm view renovate@latest engines.node)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.renovate_node.outputs.version }}

      # Renovate ajetaan Mendin ylläpitämänä sovelluksena, joka seuraa aina uusinta
      # julkaisua, joten validaattoria ei pinnata. --strict kaatuu myös varoituksiin,
      # esimerkiksi vanhentuneisiin asetuksiin.
      - name: Validate renovate.json
        run: npx --yes --package renovate renovate-config-validator --strict

  ci_passed:
    name: CI passed
    runs-on: ubuntu-26.04
    needs: [changes, no_merge_commits, tests, appconfig_check, trivy, node_vulnerabilities, zizmor, renovate_config]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify every check is gated
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jobs=$(yq '.jobs | keys - ["ci_passed"] | .[]' .github/workflows/ci.yaml)
          for job in $jobs; do
            if ! echo "$RESULTS" | jq -e --arg job "$job" 'has($job)' > /dev/null; then
              echo "::error::job '$job' is missing from the needs list of ci_passed"
              exit 1
            fi
          done

      - name: Verify CI results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
