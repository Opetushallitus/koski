name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    # PR-ajoissa testit valitaan muutettujen polkujen perusteella.
    # OAuth2-integraatiotestit käyttävät myös Kosken kansalaiskäyttöliittymää.
    # Valpaksen testejä ei ajeta Kosken käyttöliittymämuutoksista: Valpaksen käyttämä
    # kansalaisen paikallinen kirjautuminen testataan Kosken Playwright-testeissä
    # (web/test/e2e/valpas-kansalaisen-kirjautuminen.spec.ts).
    outputs:
      backend: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' }}
      koski-ui: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.koski-ui == 'true' }}
      valpas-ui: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.valpas-ui == 'true' }}
      oauth2: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.koski-ui == 'true' || steps.filter.outputs.oauth2 == 'true' }}
      smoketests: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.smoketests == 'true' }}
      radiator: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.radiator == 'true' }}
      history-debug: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.history-debug == 'true' }}
      renovate: ${{ steps.filter.outputs.renovate == 'true' }}
      dependencies: ${{ steps.filter.outputs.dependencies == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # Oletuksena ajetaan kaikki testit. Vain erikseen rajatut polut saavat suppeamman testiajon.
            all:
              - '**'
              - '!src/**'
              - '!scala-schema/**'
              - '!web/**'
              - '!json-schema-viewer/**'
              - '!.browserslistrc'
              - '!valpas-web/**'
              - '!omadata-oauth2-sample/**'
              - '!smoketests/**'
              - '!radiator/**'
              - '!scripts/opiskeluoikeushistoria-debug/**'
              - '!.claude/**'
              - '!sandbox/**'
              - '!renovate.json'
              - '!.gitignore'
              - '!.git-blame-ignore-revs'
              - '!.trivyignore'
              - '!img.png'
              - '!owasp-dependency-check-suppressions.xml'
              - &documentation-exclusions
                - '!documentation/**'
                - '!*.md'
                - '!**/README.md'
                - '!LICENSE.txt'

            backend:
              - *documentation-exclusions
              - 'src/**'
              - 'scala-schema/**'

            koski-ui:
              - *documentation-exclusions
              - 'web/**'
              - 'json-schema-viewer/**'
              - '.browserslistrc'

            valpas-ui:
              - *documentation-exclusions
              - 'valpas-web/**'
              - '.browserslistrc'

            oauth2:
              - *documentation-exclusions
              - 'omadata-oauth2-sample/**'

            smoketests:
              - *documentation-exclusions
              - 'smoketests/**'

            radiator:
              - *documentation-exclusions
              - 'radiator/**'

            history-debug:
              - *documentation-exclusions
              - 'scripts/opiskeluoikeushistoria-debug/**'

            renovate:
              - 'renovate.json'

            dependencies:
              - '**/pom.xml'
              - '**/pnpm-lock.yaml'
              - '.trivyignore'
              - '.github/workflows/trivy_check.yml'

  tests:
    name: "Tests"
    needs: [changes]
    # Vain yhden Renovate-PR:n testiajo saa olla käynnissä kerrallaan.
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'renovate[bot]' && 'ci-tests-renovate' || format('ci-tests-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      packages: read
    with:
      run-backend-tests: ${{ needs.changes.outputs.backend == 'true' }}
      run-koski-ui-tests: ${{ needs.changes.outputs.koski-ui == 'true' }}
      run-valpas-ui-tests: ${{ needs.changes.outputs.valpas-ui == 'true' }}
      run-oauth2-tests: ${{ needs.changes.outputs.oauth2 == 'true' }}
      run-smoketests-tests: ${{ needs.changes.outputs.smoketests == 'true' }}
      run-radiator-tests: ${{ needs.changes.outputs.radiator == 'true' }}
      run-history-debug-tests: ${{ needs.changes.outputs.history-debug == 'true' }}

  trivy:
    name: Trivy
    needs: [changes]
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    uses: ./.github/workflows/trivy_check.yml
    permissions:
      contents: read

  renovate_config:
    name: Renovate config check
    needs: [changes]
    if: ${{ needs.changes.outputs.renovate == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"

      # Renovate ajetaan Mendin ylläpitämänä sovelluksena, joka seuraa aina uusinta
      # julkaisua, joten validaattoria ei pinnata. --strict kaatuu myös varoituksiin,
      # esimerkiksi vanhentuneisiin asetuksiin.
      - name: Validate renovate.json
        run: npx --yes --package renovate renovate-config-validator --strict

  ci_passed:
    name: CI passed
    runs-on: ubuntu-26.04
    needs: [changes, tests, trivy, renovate_config]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every check is gated
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jobs=$(yq '.jobs | keys - ["ci_passed"] | .[]' .github/workflows/ci.yaml)
          for job in $jobs; do
            if ! echo "$RESULTS" | jq -e --arg job "$job" 'has($job)' > /dev/null; then
              echo "::error::job '$job' is missing from the needs list of ci_passed"
              exit 1
            fi
          done

      - name: Verify CI results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
