name: Run smoketests
on:
  schedule:
    - cron: "30 8-15 * * SUN-SAT"
      timezone: Europe/Helsinki
  workflow_dispatch:
  workflow_call:
    inputs:
      expected_commithash:
        description: Git commit expected in QA before smoke tests
        type: string
        required: false
        default: ""

jobs:
  deploy_in_progress:
    name: Check for QA deploy in progress
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      in_progress: ${{ steps.check.outputs.in_progress }}
    steps:
      - name: Look for unfinished deploy runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # waiting = prod-asennus odottaa hyväksyntää, mahdollisesti ikuisesti
          UNFINISHED_JOBS=$(
            for RUN_ID in $(gh run list --workflow master.yml --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'); do
              gh api "repos/{owner}/{repo}/actions/runs/$RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | select(.status != "completed" and .status != "waiting") | .name'
            done
          )
          if [ -n "$UNFINISHED_JOBS" ]; then
            echo "$UNFINISHED_JOBS"
            echo "::notice::Deploy in progress, skipping scheduled smoketests"
            echo "in_progress=true" >> "$GITHUB_OUTPUT"
          fi

  smoketests:
    name: QA
    needs: [deploy_in_progress]
    if: ${{ !cancelled() && needs.deploy_in_progress.outputs.in_progress != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: koski-qa-smoketests
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"

      - uses: ./.github/actions/setup_pnpm_cache

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          max_attempts: 5
          timeout_minutes: 5
          retry_wait_seconds: 120
          command: |
            cd smoketests
            pnpm install --frozen-lockfile

      - name: Verify QA version
        id: qa-versio
        if: ${{ inputs.expected_commithash != '' }}
        env:
          EXPECTED_COMMIT_HASH: ${{ inputs.expected_commithash }}
          GH_TOKEN: ${{ github.token }}
        working-directory: smoketests
        run: |
          MASTER_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$MASTER_SHA" != "$EXPECTED_COMMIT_HASH" ]; then
            echo "::notice::Master has moved on to $MASTER_SHA, skipping smoketests of $EXPECTED_COMMIT_HASH"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm run qa:versio

      - name: Install Puppeteer browser
        if: ${{ steps.qa-versio.outputs.superseded != 'true' }}
        run: |
          cd smoketests
          pnpm exec puppeteer browsers install chrome

      - name: Test kansalaisen näkymä testiopintopolussa
        if: ${{ steps.qa-versio.outputs.superseded != 'true' }}
        run: cd smoketests && pnpm run qa:kansalainen

      - name: Test omadata-oauth2-sample testiopintopolussa
        if: ${{ steps.qa-versio.outputs.superseded != 'true' }}
        run: cd smoketests && pnpm run omadata:qa

      - name: Test kielitutkintotodistus tiedote flow
        if: ${{ steps.qa-versio.outputs.superseded != 'true' }}
        env:
          KOSKI_BASE_URL: https://koski.testiopintopolku.fi/koski
          KOSKI_USER: ${{ secrets.KOSKI_USER_USERNAME }}
          KOSKI_PASS: ${{ secrets.KOSKI_USER_PASSWORD }}
          TIEDOTE_SMOKETEST_OO_OID: "1.2.246.562.15.98526955087"
        run: cd smoketests && pnpm run qa:tiedote

      - name: Report failure
        uses: ./.github/actions/report-slack
        if: ${{ failure() && !cancelled() }}
        with:
          webhook: ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
          title: ":fire: SMOKETESTS · :x: Run smoketests: failure in QA version verification or smoke tests"
          include_context: repo workflow branch commit actor ci_run
