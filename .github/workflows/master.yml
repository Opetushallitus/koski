name: Publish and deploy master

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: "Tests"
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read

  notify_failure:
    name: Report CI failure to Slack
    needs: [tests]
    if: ${{ failure() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: $/.github/actions/report-slack
        with:
          webhook: ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
          title: ":rotating_light: CI failed on master"
          include_context: repo commit actor ci_run

  publish_and_deploy:
    name: Publish & deploy
    needs: [tests]
    uses: $/.github/workflows/publish_and_deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: write
    secrets:
      ECR_ROLE: ${{ secrets.ECR_ROLE }}
      DEPLOY_ROLE: ${{ secrets.DEPLOY_ROLE }}
      ECR_ACCOUNT_ID: ${{ secrets.ECR_ACCOUNT_ID }}
      KOSKI_USER_USERNAME: ${{ secrets.KOSKI_USER_USERNAME }}
      KOSKI_USER_PASSWORD: ${{ secrets.KOSKI_USER_PASSWORD }}
      SLACK_CI_ALERTS_WEBHOOK: ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
