name: Publish
on:
  workflow_call:
    inputs:
      commithash:
        description: "Commit hash (version) of the image to package and publish"
        type: string
        required: true
env:
  DOCKER_BUILDKIT: 1
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  check_image:
    name: Check image
    runs-on: ubuntu-26.04
    environment: dev
    permissions:
      id-token: write
    outputs:
      image-exists: ${{ steps.check-image.outputs.image-exists }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE }}
          role-duration-seconds: 3600
          role-session-name: KoskiPublishEcr-dev-${{ inputs.commithash }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ secrets.ECR_ACCOUNT_ID }}
          mask-password: "true"

      - name: Check if container image already exists in ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: koski
          IMAGE_TAG: ${{ inputs.commithash }}
        id: check-image
        run: |
          echo "image-exists=$(docker manifest inspect $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG > /dev/null 2>&1 ; echo $?)" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: [check_image]
    if: needs.check_image.outputs.image-exists != '0'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commithash }}

      - uses: $/.github/actions/build_koski
        with:
          commithash: ${{ inputs.commithash }}

  publish:
    name: Docker image
    needs: [check_image, build]
    if: needs.check_image.outputs.image-exists != '0'
    runs-on: ubuntu-26.04
    environment: dev
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commithash }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE }}
          role-duration-seconds: 3600
          role-session-name: KoskiPublishEcr-dev-${{ inputs.commithash }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ secrets.ECR_ACCOUNT_ID }}
          mask-password: "true"

      - uses: $/.github/actions/setup_java_25

      - name: Restore target dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "target/"
          key: ${{ runner.os }}-target-${{ inputs.commithash }}
          fail-on-cache-miss: "true"

      - name: Build application and publish it to Github Packages
        env:
          version: ${{ inputs.commithash }}
        run: |
          ./mvnw versions:set -DnewVersion="$version" --batch-mode
          ./mvnw war:war deploy:deploy --batch-mode -Dmaven.skip.install=true -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/Opetushallitus/koski

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: koski
          IMAGE_TAG: ${{ inputs.commithash }}
        run: |
          docker build -f docker-build/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --build-arg KOSKI_VERSION=$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
