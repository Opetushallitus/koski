name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev/qa/prod)"
        required: true
        default: "dev"
      commithash:
        description: "Commit hash to deploy from"
        required: true
      force:
        description: "Force deploy"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

run-name: Deploy to ${{ inputs.environment }} (${{ inputs.commithash }})
jobs:
  check-master:
    name: Check commit contains master
    runs-on: ubuntu-26.04
    steps:
      - name: Verify commit contains latest master
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_HASH: ${{ inputs.commithash }}
        run: |
          set -euo pipefail
          MASTER_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          echo "Master is at $MASTER_SHA — comparing against $COMMIT_HASH"
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$MASTER_SHA...$COMMIT_HASH" --jq '.status')
          if [ "$STATUS" = "behind" ] || [ "$STATUS" = "diverged" ]; then
            echo "::error::Commit $COMMIT_HASH does not contain latest master."
            exit 1
          fi
  publish_image:
    name: Publish Koski Docker Image and package
    needs: [check-master]
    uses: $/.github/workflows/publish_image.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      commithash: ${{ inputs.commithash }}
    secrets:
      ECR_ROLE: ${{ secrets.ECR_ROLE }}
      ECR_ACCOUNT_ID: ${{ secrets.ECR_ACCOUNT_ID }}
  deploy:
    name: Deploy
    needs: [publish_image]
    uses: $/.github/workflows/deploy_koski.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      commithash: ${{ inputs.commithash }}
    secrets:
      DEPLOY_ROLE: ${{ secrets.DEPLOY_ROLE }}
      ECR_ACCOUNT_ID: ${{ secrets.ECR_ACCOUNT_ID }}
      SLACK_CI_ALERTS_WEBHOOK: ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
  announce_qa_dev_build:
    name: Announce QA dev build
    needs: [deploy]
    if: ${{ inputs.environment == 'qa' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check whether commit is in master
        id: in_master
        uses: $/.github/actions/commit-in-master
        with:
          commit_sha: ${{ inputs.commithash }}

      - name: Report QA dev build
        if: ${{ steps.in_master.outputs.in_master == 'false' }}
        uses: $/.github/actions/report-slack
        with:
          webhook: ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
          title: ":construction: DEPLOY · QA now runs a dev build. Master deploys to QA wait for approval instead of overwriting automatically."
          commit_sha: ${{ inputs.commithash }}
          include_context: commit actor ci_run
