name: Publish & deploy
on:
  workflow_call:
env:
  DOCKER_BUILDKIT: 1
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  TZ: Europe/Helsinki

jobs:
  check_master_head:
    name: Check master HEAD
    runs-on: ubuntu-26.04
    outputs:
      is_head: ${{ steps.check.outputs.is_head }}
    steps:
      - name: Compare commit to master HEAD
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MASTER_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$MASTER_SHA" = "$GITHUB_SHA" ]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Master has moved on to $MASTER_SHA, skipping publish and deploy of $GITHUB_SHA"
            echo "is_head=false" >> "$GITHUB_OUTPUT"
          fi

  publish_image:
    name: Publish
    needs: [check_master_head]
    if: ${{ needs.check_master_head.outputs.is_head == 'true' }}
    uses: ./.github/workflows/publish_image.yml
    with:
      commithash: ${{ github.sha }}
    secrets: inherit

  deploy_dev_qa:
    name: Dev & QA
    needs: [publish_image]
    # Ei cancel-in-progress: hitaampi vanhemman commitin ajo voisi keskeyttää uudemman ajon
    # ja asentaa vanhemman version. Vanhentuneet ajot ohitetaan check_master_head-jobissa.
    # queue: max, koska oletuksena uusi jonoon tuleva ajo peruisi jo jonossa odottavan.
    concurrency:
      group: master-deploy-dev-qa
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/deploy_dev_qa.yml
    secrets: inherit

  deploy_omadataoauth2sample_dev:
    name: OmaData dev
    needs: [deploy_dev_qa]
    uses: ./.github/workflows/omadataoauth2sample_deploy.yml
    with:
      environment: dev
      commithash: ${{ github.sha }}
    secrets: inherit

  deploy_omadataoauth2sample_qa:
    name: OmaData QA
    needs: [deploy_dev_qa]
    uses: ./.github/workflows/omadataoauth2sample_deploy.yml
    with:
      environment: qa
      commithash: ${{ github.sha }}
    secrets: inherit

  smoketests_qa:
    name: Smoketests
    needs: [deploy_dev_qa, deploy_omadataoauth2sample_qa]
    if: ${{ !cancelled() && needs.deploy_dev_qa.result == 'success' }}
    uses: ./.github/workflows/run_smoketests.yml
    with:
      expected_commithash: ${{ github.sha }}
    secrets: inherit

  deploy_prod:
    name: Prod
    needs: [deploy_dev_qa]
    uses: ./.github/workflows/deploy_koski.yml
    with:
      environment: prod
      commithash: ${{ github.sha }}
    secrets: inherit
