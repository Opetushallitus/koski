name: Publish and deploy
on:
  workflow_call:
env:
  DOCKER_BUILDKIT: 1
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  TZ: Europe/Helsinki

jobs:
  publish_image:
    name: Publish Koski Docker Image and package
    uses: ./.github/workflows/publish_image.yml
    with:
      commithash: ${{ github.sha }}
    secrets: inherit

  deploy_dev:
    name: Deploy to dev environment
    needs: [publish_image]
    uses: ./.github/workflows/deploy_koski.yml
    with:
      environment: dev
      commithash: ${{ github.sha }}
    secrets: inherit

  deploy_omadataoauth2sample_dev:
    name: Deploy OmaData OAuth2 sample to dev environment
    needs: [deploy_dev]
    uses: ./.github/workflows/omadataoauth2sample_deploy.yml
    with:
      environment: dev
      commithash: ${{ github.sha }}
    secrets: inherit

  deploy_qa:
    name: Deploy to qa environment
    needs: [deploy_dev]
    uses: ./.github/workflows/deploy_koski.yml
    with:
      environment: qa
      commithash: ${{ github.sha }}
    secrets: inherit

  deploy_omadataoauth2sample_qa:
    name: Deploy OmaData OAuth2 sample to qa environment
    needs: [deploy_qa]
    uses: ./.github/workflows/omadataoauth2sample_deploy.yml
    with:
      environment: qa
      commithash: ${{ github.sha }}
    secrets: inherit

  smoketests_qa:
    name: Run QA smoketests
    needs: [deploy_qa, deploy_omadataoauth2sample_qa]
    if: ${{ !cancelled() && needs.deploy_qa.result == 'success' }}
    uses: ./.github/workflows/run_smoketests.yml
    with:
      expected_commithash: ${{ github.sha }}
    secrets: inherit

  deploy_prod:
    name: Deploy to prod environment
    needs: [ deploy_qa ]
    uses: ./.github/workflows/deploy_koski.yml
    with:
      environment: prod
      commithash: ${{ github.sha }}
    secrets: inherit
