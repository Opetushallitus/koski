name: OmaDataOAuth2 browser tests (Playwright)
description: "Run one shard of the OmaDataOAuth2 sample Playwright tests"

inputs:
  shardIndex:
    description: "1-based index of the shard to run"
    required: true
  shardTotal:
    description: "Total number of shards"
    required: true

runs:
  using: "composite"
  steps:
    - name: "🔨 Setup Java"
      uses: ./.github/actions/setup_java_25
    - name: "🔨 Setup backend and databases"
      uses: ./.github/actions/setup_backend
    - name: "🌍 Setup Playwright"
      uses: ./.github/actions/setup_playwright
      with:
        workingDirectory: omadata-oauth2-sample/server

    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SHARD_INDEX: ${{inputs.shardIndex}}
        PLAYWRIGHT_SHARD_TOTAL: ${{inputs.shardTotal}}
        PLAYWRIGHT_HTML_REPORT: omadataoauth2-e2e-report-${{inputs.shardIndex}}-of-${{inputs.shardTotal}}
      run: ./mvnw scalatest:test -DwildcardSuites="fi.oph.koski.omadataoauth2.e2e" --batch-mode --no-snapshot-updates
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: omadataoauth2-e2e-report-${{inputs.shardIndex}}-of-${{inputs.shardTotal}}
        path: omadata-oauth2-sample/server/omadataoauth2-e2e-report-${{inputs.shardIndex}}-of-${{inputs.shardTotal}}/
        retention-days: 3
