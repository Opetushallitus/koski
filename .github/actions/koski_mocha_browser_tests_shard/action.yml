inputs:
  shardIndex:
    required: true
    type: string
  shardTotal:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: "🔨 Setup Java"
      uses: ./.github/actions/setup_java_17
    - name: "🔨 Setup backend and databases"
      uses: ./.github/actions/setup_backend

    - name: Install js deps
      run: cd web && pnpm install --frozen-lockfile
      shell: bash

    - name: Get Puppeteer version
      id: puppeteer-version
      run: echo "VERSION=$(sed --quiet --regexp-extended 's/^  puppeteer@([^(:]+):$/\1/p' web/pnpm-lock.yaml)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache Puppeteer browser
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ steps.puppeteer-version.outputs.VERSION }}

    - name: Run frontend tests
      env:
        MOCHA_SHARD_INDEX: ${{inputs.shardIndex}}
        MOCHA_SHARD_TOTAL: ${{inputs.shardTotal}}
      run: mvn scalatest:test -Dsuites="fi.oph.koski.mocha.KoskiParallelMochaSpec" --batch-mode --no-snapshot-updates
      shell: bash

    - name: Archive test screenshots
      if: ${{ failure() }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: screenshots
        path: web/target/screenshots
