name: Koski visual regression tests

runs:
  using: "composite"
  steps:
    - name: "🔨 Setup Java"
      uses: ./.github/actions/setup_java_17
    - name: "🔨 Setup backend and databases"
      uses: ./.github/actions/setup_backend
    - name: "Install web dependencies"
      working-directory: web
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: "Run visual regression tests"
      env:
        PLAYWRIGHT_HTML_REPORT: koski-visual-report
      run: mvn scalatest:test -Pintegrationtest -Dsuites="fi.oph.koski.e2e.KoskiVisualFrontSpec" --batch-mode --no-snapshot-updates
      shell: bash

    - name: "Upload HTML report"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: koski-visual-report
        path: web/koski-visual-report/
        retention-days: 3

    - name: "🔍 Upload screenshot diffs"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: koski-visual-diffs
        path: web/test-results/
        retention-days: 3
        if-no-files-found: ignore
