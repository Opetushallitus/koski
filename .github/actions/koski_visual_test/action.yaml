name: Koski visual regression tests

runs:
  using: "composite"
  steps:
    - name: "🔨 Setup Java"
      uses: ./.github/actions/setup_java_17
    - name: "🔨 Setup backend and databases"
      uses: ./.github/actions/setup_backend
    - name: "Install web dependencies"
      working-directory: web
      env:
        PNPM_FROZEN_FLAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && '--no-frozen-lockfile' || '--frozen-lockfile' }}
      run: pnpm install $PNPM_FROZEN_FLAG
      shell: bash

    - name: "Run visual regression tests"
      env:
        PLAYWRIGHT_HTML_REPORT: koski-visual-report
      run: mvn scalatest:test -Pintegrationtest -Dsuites="fi.oph.koski.e2e.KoskiVisualFrontSpec" --batch-mode
      shell: bash

    - name: "Upload HTML report"
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      if: always()
      with:
        name: koski-visual-report
        path: web/koski-visual-report/
        retention-days: 3

    - name: "🔍 Upload screenshot diffs"
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      if: failure()
      with:
        name: koski-visual-diffs
        path: web/test-results/
        retention-days: 3
        if-no-files-found: ignore
