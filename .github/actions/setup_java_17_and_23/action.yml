runs:
  using: composite
  steps:
    - name: Set GitHub Packages credentials for Maven
      shell: bash
      run: echo "KOSKI_GITHUB_PACKAGES_TOKEN=${{ github.token }}" >> $GITHUB_ENV
    - name: Set up Java 17 and 23
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: |
          23
          17
        architecture: "x64"
        distribution: "zulu"
        cache: "maven"
