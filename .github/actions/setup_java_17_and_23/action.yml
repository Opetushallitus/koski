runs:
  using: composite
  steps:
    - name: Set GitHub Packages credentials for Maven
      shell: bash
      run: echo "KOSKI_GITHUB_PACKAGES_TOKEN=${{ github.token }}" >> $GITHUB_ENV
    - name: Set up Java 17 and 23
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        java-version: |
          23
          17
        architecture: "x64"
        distribution: "zulu"
        cache: "maven"
