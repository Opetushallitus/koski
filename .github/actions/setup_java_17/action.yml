name: Set up Java 17
description: Set up Java 17, Maven caching, and GitHub Packages credentials

inputs:
  cache-read-only:
    description: >
      Jos true, ~/.m2-välimuistia ei tallenneta jobin lopuksi. Oletus on true,
      koska setup-javan post-vaihe ajetaan myös epäonnistuneessa jobissa: kesken
      jäänyt riippuvuuksien lataus tallentuisi vajaana pom-hashin mukaiselle
      avaimelle, ja koska avaimet ovat muuttumattomia, vajaa välimuisti jäisi
      voimaan seuraaviin ajoihin asti. Vain build_koski kirjoittaa välimuistin.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set GitHub Packages credentials for Maven
      shell: bash
      run: echo "KOSKI_GITHUB_PACKAGES_TOKEN=${{ github.token }}" >> $GITHUB_ENV
    - name: Set up Java 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: "17"
        architecture: "x64"
        distribution: "corretto"
        cache: "maven"
        cache-read-only: ${{ inputs.cache-read-only }}
