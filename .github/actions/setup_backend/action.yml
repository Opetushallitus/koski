runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup_pnpm_cache
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: ".nvmrc"

    - name: Configure sysctl limits for OpenSearch
      run: |
        sudo swapoff -a
        sudo sysctl -w vm.swappiness=1
        sudo sysctl -w fs.file-max=262144
        sudo sysctl -w vm.max_map_count=262144
      shell: bash

    # Docker Hub palauttaa ajoittain 5xx-virheitä tai auth-timeouteja, imageiden hakua
    # yritetään uudelleen. --policy missing ei hae uudelleen jo ladattuja imageja.
    - name: Pull and build container images
      run: |
        for attempt in {1..4}; do
          docker compose --progress quiet pull --policy missing --ignore-buildable && docker compose --progress quiet build && break
          if [ "$attempt" -eq 4 ]; then exit 1; fi
          delay=$(( 10 * 2 ** (attempt - 1) + RANDOM % 10 ))
          echo "::warning::Container image pull/build failed (attempt $attempt/4), retrying in ${delay}s"
          sleep "$delay"
        done
      shell: bash

    - name: Start Postgres and OS containers
      run: docker compose --progress quiet up --detach
      shell: bash

    - name: Restore target dir
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
      with:
        path: "target/"
        key: ${{ runner.os }}-target-${{ github.sha }}
        fail-on-cache-miss: "true"
