runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup_pnpm_cache
    - name: Setup Node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: "24.18.0"

    - name: Configure sysctl limits for OpenSearch
      run: |
        sudo swapoff -a
        sudo sysctl -w vm.swappiness=1
        sudo sysctl -w fs.file-max=262144
        sudo sysctl -w vm.max_map_count=262144
      shell: bash

    - name: Start Postgres and OS containers
      # Docker Hub ajoittain nihkeä vastaamaan, jolloin image-pull kaatuu
      # ("context deadline exceeded"). up -d on idempotentti, joten uudelleenyritys
      # on turvallinen: jo käynnistyneet kontit jätetään rauhaan.
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
      with:
        max_attempts: 3
        timeout_minutes: 5
        retry_wait_seconds: 30
        command: docker compose --progress quiet up -d

    - name: Restore target dir
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
      with:
        path: "target/"
        key: ${{ runner.os }}-target-${{ github.sha }}
        fail-on-cache-miss: "true"
