name: Set up Java 25
description: Set up Java 25, Maven caching, and GitHub Packages credentials

inputs:
  cache-read-only:
    description: >
      Jos true, Maven-välimuisti vain palautetaan eikä sitä tallenneta jobin
      lopuksi.
    required: false
    default: "true"
  cache-dependency-path:
    description: >
      Polut, joiden sisällöstä Maven-välimuistin avain lasketaan.
    required: false
    default: |
      **/pom.xml
      **/.mvn/wrapper/maven-wrapper.properties
      **/.mvn/extensions.xml

runs:
  using: composite
  steps:
    - name: Set GitHub Packages credentials for Maven
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: echo "KOSKI_GITHUB_PACKAGES_TOKEN=$GITHUB_TOKEN" >> "$GITHUB_ENV" # zizmor: ignore[github-env] kirjoitettava arvo on github.token, ei ulkopuolista syötettä
    - name: Set up Java 25
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: "25"
        architecture: "x64"
        distribution: "corretto"
    - name: Get Maven cache month
      id: maven-cache
      shell: bash
      run: echo "MONTH=$(date --utc +%Y-%m)" >> "$GITHUB_OUTPUT"
    - name: Cache Maven repository
      if: inputs.cache-read-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ steps.maven-cache.outputs.MONTH }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ steps.maven-cache.outputs.MONTH }}-
    - name: Restore Maven repository
      if: inputs.cache-read-only == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ steps.maven-cache.outputs.MONTH }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ steps.maven-cache.outputs.MONTH }}-
