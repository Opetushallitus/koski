name: Valpas integration test
description: "Run one group of the Valpas browser tests"

inputs:
  index:
    description: "Test group to run, as in make valpas-fronttest-<index>"
    required: true

runs:
  using: "composite"
  steps:
    - name: "🔨 Setup Java"
      uses: $/.github/actions/setup_java_25
    - name: "🔨 Setup backend and databases"
      uses: $/.github/actions/setup_backend

    - name: Run tests
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
      with:
        max_attempts: 2
        timeout_minutes: 45
        command: |
          cd valpas-web
          pnpm install --frozen-lockfile
          cd ..
          make valpas-fronttest-${{ inputs.index }}
