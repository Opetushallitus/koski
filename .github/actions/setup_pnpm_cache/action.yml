name: "Setup pnpm with cache"
description: "Installs pnpm and restores cache"
runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      env:
        npm_config_fetch_retries: 5
      with:
        package_json_file: package.json

    - name: Get pnpm store path and cache month
      id: pnpm-store
      shell: bash
      run: |
        {
          echo "STORE_PATH=$(pnpm store path)"
          echo "MONTH=$(date --utc +%Y-%m)"
        } >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ steps.pnpm-store.outputs.MONTH }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-${{ steps.pnpm-store.outputs.MONTH }}-
