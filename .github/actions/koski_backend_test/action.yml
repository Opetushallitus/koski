name: "Run Koski backend tests"
description: "Run the given Koski backend test suites"

inputs:
  suites:
    description: "Comma-separated packages or suites, passed to -DmembersOnlySuites"
    required: true

runs:
  using: "composite"
  steps:
    - name: "🔨 Setup Java"
      uses: $/.github/actions/setup_java_25

    - name: "🔨 Setup backend and databases"
      uses: $/.github/actions/setup_backend

    - name: Run backend tests
      env:
        SUITES: ${{ inputs.suites }}
      run: ./mvnw scalatest:test -DmembersOnlySuites="$(tr --delete '\\\n' <<< "$SUITES")" --batch-mode --no-snapshot-updates
      shell: bash

    # ScalaTest reports BUILD SUCCESS even when the suite selection matches no tests.
    - name: Verify that tests were run
      run: |
        grep --quiet --extended-regexp 'Tests: succeeded [1-9]' target/surefire-reports/koski-tests.txt || { echo "::error::No tests were executed"; exit 1; }
      shell: bash

    - name: "Upload todistus visual diffs"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: todistus-visual-diffs-${{ github.job }}
        path: target/todistus-visual-test/**/*.png
        retention-days: 3
        if-no-files-found: ignore
