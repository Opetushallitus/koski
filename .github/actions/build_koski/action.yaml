name: "Build Koski app + tests"
inputs:
  commithash:
    required: true
    type: string
    description: "Commit hash to build"
runs:
  using: composite
  steps:
    - name: Lookup existing target dir cache
      id: lookup
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/
        key: ${{ runner.os }}-target-${{ inputs.commithash }}
        lookup-only: "true"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.lookup.outputs.cache-hit != 'true'
      with:
        ref: ${{ inputs.commithash }}
    - uses: ./.github/actions/setup_pnpm_cache
    - name: Setup Node
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: ".nvmrc"
    - if: steps.lookup.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup_java_17
      with:
        # Ainoa jobi, joka saa kirjoittaa ~/.m2-välimuistin.
        cache-read-only: "false"
    - name: Build Koski app + tests
      if: steps.lookup.outputs.cache-hit != 'true'
      env:
        version: ${{ inputs.commithash }}
      run: |
        mvn versions:set -DnewVersion="$version" --batch-mode
        mvn test -DskipTests=true -Dscalac.fixableWarnings=e --batch-mode
      shell: bash
    - name: Cache target dir
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/
        key: ${{ runner.os }}-target-${{ inputs.commithash }}
