# Paikallisen kehityksen ja testien asetukset, joita pilvessä ei lueta. Tiedosto ei päädy pakettiin eikä
# konttiin, joten pilvessä näitä avaimia ei ole, eikä niitä tarvita AppConfigissa. Avain, jota luetaan myös
# pilvessä, kuuluu reference.confiin.

# Pilvessä ympäristö tulee ENV_NAME-ympäristömuuttujasta.
env = "local"

# Pilvessä IAM-kirjautuminen: host tulee ympäristömuuttujasta (DB_KOSKI_HOST ym.), käyttäjä on koski_iam
# eikä salasanaa ole.
db {
  host = "localhost"
  user = "oph"
  password = "oph"
}

# Pilvessä Virran, VTJ:n ja YTR:n asetukset tulevat Secrets Managerista.
virta {
  serviceUrl = "mock"
  #serviceUrl = "http://virtawstesti.csc.fi/luku/OpiskelijanTiedot"
  jarjestelma = "KOSKI"
  tunnus = "koski"
  avain = "salaisuus"
}

vtj {
  username = ""
  password = ""
  keystorePassword = ""
  keystore = ""
  truststore = ""
}

ytr {
  url = "mock"
  aws {
    accessKeyId = ""
    secretAccessKey = ""
    roleArn = ""
    externalId = ""
    bucket = "mock"
  }
}

# Paikallinen localstack. Pilvessä käytetään AWS:n S3:a.
kyselyt.s3.endpoint = "http://s3.localhost.localstack.cloud:4566"
todistus.s3.endpoint = "http://s3.localhost.localstack.cloud:4566"
